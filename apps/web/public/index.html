<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的博客</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page-shell">
    <div class="background-orb background-orb-left"></div>
    <div class="background-orb background-orb-right"></div>
    <header class="site-header">
      <a id="site-brand" class="brandmark" href="/">我的博客</a>
      <p id="site-header-note" class="header-note is-hidden"></p>
    </header>

    <main class="layout">
      <section class="hero">
        <div class="hero-copy">
          <p id="hero-eyebrow" class="eyebrow">从参考模板到新实现</p>
          <h1 id="hero-title">把博客做成真正适合中文阅读的内容产品。</h1>
          <p id="hero-description" class="hero-text">
            这一版不再只是“能显示文章”，而是开始强调阅读节奏、中文文案、检索能力和更清晰的信息组织。
          </p>

          <form id="search-form" class="search-bar">
            <input
              id="search-input"
              class="search-input"
              type="search"
              name="q"
              placeholder="搜索文章、分类或标签"
            />
            <button class="search-button" type="submit">搜索</button>
          </form>
        </div>

        <aside class="hero-panel">
          <div id="hero-panel-copy" class="is-hidden">
            <p id="panel-eyebrow" class="panel-label is-hidden"></p>
            <h2 id="panel-title" class="is-hidden"></h2>
            <p id="panel-description" class="is-hidden"></p>
          </div>
          <div id="stats-grid" class="stats-grid"></div>
        </aside>
      </section>

      <section class="content-grid">
        <div class="main-column">
          <div class="section-head">
            <p class="eyebrow">最新内容</p>
            <h2>文章列表</h2>
          </div>
          <div id="active-filters" class="active-filters"></div>
          <div id="feed-summary" class="feed-summary"></div>
          <div id="post-list" class="post-list"></div>
          <div id="pagination" class="pagination"></div>
        </div>

        <aside class="side-column">
          <div class="side-card">
            <p class="eyebrow">分类导航</p>
            <h2>按主题浏览</h2>
            <div id="category-list" class="category-list"></div>
            <a class="text-link archive-page-link" href="/category">进入分类专题页</a>
          </div>

          <div class="side-card">
            <p class="eyebrow">时间归档</p>
            <h2>按月份回看</h2>
            <div id="archive-list" class="archive-list"></div>
            <a class="text-link archive-page-link" href="/archive">进入完整归档页</a>
          </div>

          <div class="side-card">
            <p class="eyebrow">标签索引</p>
            <h2>快速筛选</h2>
            <div id="tag-list" class="tag-list"></div>
            <a class="text-link archive-page-link" href="/tag">进入标签专题页</a>
          </div>

          <div id="feature-card" class="side-card side-card-accent is-hidden">
            <p id="feature-eyebrow" class="eyebrow"></p>
            <h2 id="feature-title"></h2>
            <p id="feature-description"></p>
          </div>
        </aside>
      </section>
    </main>

    <template id="post-card-template">
      <article class="post-card">
        <img class="post-card-image" alt="" />
        <div class="post-card-body">
          <div class="post-meta">
            <span data-role="pin-badge" class="post-pin-badge is-hidden">置顶推荐</span>
            <a data-role="category" class="meta-link"></a>
            <span data-role="date"></span>
            <span data-role="reading-time"></span>
          </div>
          <h3 data-role="title"></h3>
          <p data-role="excerpt"></p>
          <div data-role="tags" class="post-tags"></div>
          <a class="text-link" data-role="link">阅读全文</a>
        </div>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
