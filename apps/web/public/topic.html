<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的博客 | 专题</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page-shell archive-shell">
    <div class="background-orb background-orb-left"></div>
    <div class="background-orb background-orb-right"></div>

    <header class="site-header">
      <a id="site-brand" class="brandmark" href="/">我的博客</a>
      <a class="text-link" href="/">返回首页</a>
    </header>

    <main class="layout archive-layout">
      <section class="archive-hero detail-card">
        <p id="topic-eyebrow" class="eyebrow">专题浏览</p>
        <h1 id="topic-title">按专题继续阅读</h1>
        <p id="topic-description" class="hero-text">
          这里会围绕单个分类或标签集中展示相关文章，帮助你从一个明确主题继续往下读。
        </p>
        <div id="topic-feed-summary" class="feed-summary"></div>
      </section>

      <section class="content-grid">
        <div class="main-column">
          <div class="section-head">
            <p id="topic-section-eyebrow" class="eyebrow">专题内容</p>
            <h2 id="topic-section-title">相关文章</h2>
          </div>
          <div id="topic-post-list" class="post-list"></div>
          <div id="topic-pagination" class="pagination"></div>
        </div>

        <aside class="side-column">
          <div class="side-card">
            <p id="topic-filter-eyebrow" class="eyebrow">专题索引</p>
            <h2 id="topic-filter-title">切换主题</h2>
            <div id="topic-filter-list" class="archive-list"></div>
          </div>

          <div class="side-card side-card-accent">
            <p class="eyebrow">阅读路径</p>
            <h2 id="topic-note-title">从同一主题继续往下读</h2>
            <p id="topic-note" class="archive-note">
              专题页适合在你已经找到一个感兴趣的话题后，继续集中阅读相关内容，而不是回到首页重新筛选。
            </p>
            <a class="text-link" href="/archive">也可以回到时间归档页</a>
          </div>
        </aside>
      </section>
    </main>

    <template id="topic-post-card-template">
      <article class="post-card">
        <img class="post-card-image" alt="" />
        <div class="post-card-body">
          <div class="post-meta">
            <span data-role="pin-badge" class="post-pin-badge is-hidden">置顶推荐</span>
            <a data-role="category" class="meta-link"></a>
            <span data-role="date"></span>
            <span data-role="reading-time"></span>
          </div>
          <h3 data-role="title"></h3>
          <p data-role="excerpt"></p>
          <div data-role="tags" class="post-tags"></div>
          <a class="text-link" data-role="link">阅读全文</a>
        </div>
      </article>
    </template>

    <script type="module" src="/topic.js"></script>
  </body>
</html>
